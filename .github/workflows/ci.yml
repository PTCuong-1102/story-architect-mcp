name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Cài đúng theo package-lock.json — chống breaking change upstream (zod ^4, MCP SDK ^2)
      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Typecheck & build
        run: npm run build

      - name: Test
        run: npm test

      # Smoke qua MCP transport thật (InMemory + stdio). Bắt lỗi mà unit
      # test không thấy: registration thiếu, throw thô thay vì isError,
      # stdout ô nhiễm, lệch số tools/resources so với README.
      - name: Smoke (edge + all-tools + stdio)
        run: |
          npx tsx scripts/smoke-edge-cases.ts
          npx tsx scripts/smoke-all-tools.ts
          npx tsx scripts/smoke-stdio.ts
